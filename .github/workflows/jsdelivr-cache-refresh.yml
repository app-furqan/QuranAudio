name: Refresh jsDelivr Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_purge:
        description: "Purge all tracked files recursively"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge jsDelivr (batch of 10)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_PURGE: ${{ github.event.inputs.full_purge || 'false' }}
        run: |
          set -euo pipefail

          purge_endpoint="https://purge.jsdelivr.net/"
          batch_size=10

          declare -a changed_paths=()
          declare -a purge_targets=()
          declare -A seen_changed=()
          declare -A seen_targets=()

          add_changed_path() {
            local p="$1"
            [[ -z "$p" ]] && return 0
            if [[ -z "${seen_changed[$p]+x}" ]]; then
              seen_changed["$p"]=1
              changed_paths+=("$p")
            fi
          }

          add_target_pair() {
            local rel_path="$1"
            local p1="/gh/${REPO}@main${rel_path}"
            local p2="/gh/${REPO}${rel_path}"

            if [[ -z "${seen_targets[$p1]+x}" ]]; then
              seen_targets["$p1"]=1
              purge_targets+=("$p1")
            fi
            if [[ -z "${seen_targets[$p2]+x}" ]]; then
              seen_targets["$p2"]=1
              purge_targets+=("$p2")
            fi
          }

          collect_from_diff() {
            local from_ref="$1"
            local to_ref="$2"
            local line status rest old_path new_path

            mapfile -t diff_lines < <(git diff --name-status --find-renames "$from_ref" "$to_ref" || true)
            for line in "${diff_lines[@]}"; do
              [[ -z "$line" ]] && continue
              status="${line%%$'\t'*}"
              rest="${line#*$'\t'}"

              case "$status" in
                R*|C*)
                  old_path="${rest%%$'\t'*}"
                  new_path="${rest#*$'\t'}"
                  add_changed_path "$old_path"
                  add_changed_path "$new_path"
                  ;;
                *)
                  add_changed_path "$rest"
                  ;;
              esac
            done
          }

          # Always include root and directory paths.
          add_target_pair ""
          add_target_pair "/RaadAlKurdi"
          add_target_pair "/RaadAlKurdi/"
          add_target_pair "/RaadAlKurdi/segments"
          add_target_pair "/RaadAlKurdi/segments/"

          if [[ "${FULL_PURGE}" == "true" ]]; then
            echo "Manual full purge requested."
            mapfile -t all_files < <(git ls-tree -r --name-only "${SHA}")
            for file in "${all_files[@]}"; do
              [[ -z "$file" ]] && continue
              add_target_pair "/${file}"
            done
          elif [[ -n "${BEFORE:-}" ]] && [[ "${BEFORE}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Collecting changed paths between ${BEFORE} and ${SHA}"
            collect_from_diff "${BEFORE}" "${SHA}"
            for file in "${changed_paths[@]}"; do
              add_target_pair "/${file}"
            done
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]] && git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "Manual run detected; collecting changed paths between HEAD~1 and HEAD"
            collect_from_diff HEAD~1 HEAD
            for file in "${changed_paths[@]}"; do
              add_target_pair "/${file}"
            done
          else
            echo "No valid commit range found; purging only root/directories."
          fi

          total=${#purge_targets[@]}
          if [[ "$total" -eq 0 ]]; then
            echo "No purge targets."
            exit 0
          fi

          echo "Purging ${total} jsDelivr paths in batches of ${batch_size}."

          ok=0
          fail=0
          i=0
          while [[ "$i" -lt "$total" ]]; do
            batch=("${purge_targets[@]:$i:$batch_size}")
            payload=$(printf '%s\n' "${batch[@]}" | jq -R . | jq -s '{path: .}')

            echo "Submitting batch starting at index ${i} (size ${#batch[@]})."
            if response=$(curl -fsS -H "content-type: application/json" -d "$payload" "$purge_endpoint"); then
              ok=$((ok + ${#batch[@]}))
              echo "Batch accepted: ${response}"
            else
              fail=$((fail + ${#batch[@]}))
              echo "Batch failed at index ${i}."
            fi

            i=$((i + batch_size))
          done

          echo "Purge done. Accepted paths: ${ok}, failed paths: ${fail}."

          if [[ "$fail" -gt 0 ]]; then
            exit 1
          fi
