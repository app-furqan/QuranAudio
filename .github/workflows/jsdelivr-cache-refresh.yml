name: Refresh jsDelivr Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge jsDelivr (changed files only)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          purged_count=0
          failed_count=0

          purge_one() {
            local rel_path="$1"
            local base

            for base in \
              "https://purge.jsdelivr.net/gh/${REPO}@main" \
              "https://purge.jsdelivr.net/gh/${REPO}"; do
              local url="${base}${rel_path}"
              echo "Purging: $url"
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$url" >/dev/null; then
                purged_count=$((purged_count + 1))
              else
                failed_count=$((failed_count + 1))
                echo "Warning: purge failed for $url"
              fi
            done
          }

          # Purge root and directory paths first so listing/index caches are refreshed.
          purge_one ""
          purge_one "/RaadAlKurdi"
          purge_one "/RaadAlKurdi/"
          purge_one "/RaadAlKurdi/segments"
          purge_one "/RaadAlKurdi/segments/"

          changed_files=()

          if [[ -n "${BEFORE:-}" ]] && [[ "${BEFORE}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Collecting changed files between ${BEFORE} and ${SHA}"
            mapfile -t changed_files < <(git diff --name-only "${BEFORE}" "${SHA}" || true)
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]] && git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "Manual run detected; collecting changed files between HEAD~1 and HEAD"
            mapfile -t changed_files < <(git diff --name-only HEAD~1 HEAD || true)
          else
            echo "No valid commit range found; purging key paths only."
          fi

          for file in "${changed_files[@]}"; do
            [[ -z "$file" ]] && continue
            purge_one "/${file}"
          done

          echo "jsDelivr changed-file purge completed. Successful URL purges: ${purged_count}, failed: ${failed_count}"

          if [[ "${failed_count}" -gt 0 ]]; then
            echo "One or more purge requests failed."
            exit 1
          fi
