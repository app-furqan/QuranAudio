name: Refresh jsDelivr Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_purge:
        description: "Purge all tracked files recursively"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge jsDelivr (changed files only)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_PURGE: ${{ github.event.inputs.full_purge || 'false' }}
        run: |
          set -euo pipefail

          purged_count=0
          failed_count=0

          purge_one() {
            local rel_path="$1"
            local base

            for base in \
              "https://purge.jsdelivr.net/gh/${REPO}@main" \
              "https://purge.jsdelivr.net/gh/${REPO}"; do
              local url="${base}${rel_path}"
              echo "Purging: $url"
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$url" >/dev/null; then
                purged_count=$((purged_count + 1))
              else
                failed_count=$((failed_count + 1))
                echo "Warning: purge failed for $url"
              fi
            done
          }

          # Purge root and directory paths first so listing/index caches are refreshed.
          purge_one ""
          purge_one "/RaadAlKurdi"
          purge_one "/RaadAlKurdi/"
          purge_one "/RaadAlKurdi/segments"
          purge_one "/RaadAlKurdi/segments/"

          changed_paths=()

          collect_from_diff() {
            local from_ref="$1"
            local to_ref="$2"
            local line status rest old_path new_path

            mapfile -t diff_lines < <(git diff --name-status --find-renames "$from_ref" "$to_ref" || true)
            for line in "${diff_lines[@]}"; do
              [[ -z "$line" ]] && continue
              status="${line%%$'\t'*}"
              rest="${line#*$'\t'}"

              case "$status" in
                R*|C*)
                  old_path="${rest%%$'\t'*}"
                  new_path="${rest#*$'\t'}"
                  [[ -n "$old_path" ]] && changed_paths+=("$old_path")
                  [[ -n "$new_path" ]] && changed_paths+=("$new_path")
                  ;;
                *)
                  [[ -n "$rest" ]] && changed_paths+=("$rest")
                  ;;
              esac
            done
          }

          if [[ "${FULL_PURGE}" == "true" ]]; then
            echo "Manual full purge requested; collecting all tracked files from ${SHA}"
            mapfile -t changed_paths < <(git ls-tree -r --name-only "${SHA}")
          elif [[ -n "${BEFORE:-}" ]] && [[ "${BEFORE}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Collecting changed paths between ${BEFORE} and ${SHA} (including renamed/deleted paths)"
            collect_from_diff "${BEFORE}" "${SHA}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]] && git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "Manual run detected; collecting changed paths between HEAD~1 and HEAD"
            collect_from_diff HEAD~1 HEAD
          else
            echo "No valid commit range found; purging key paths only."
          fi

          declare -A seen_paths=()
          for file in "${changed_paths[@]}"; do
            [[ -z "$file" ]] && continue
            if [[ -z "${seen_paths[$file]+x}" ]]; then
              seen_paths["$file"]=1
              purge_one "/${file}"
            fi
          done

          echo "jsDelivr changed-file purge completed. Successful URL purges: ${purged_count}, failed: ${failed_count}"

          if [[ "${failed_count}" -gt 0 ]]; then
            echo "One or more purge requests failed."
            exit 1
          fi
