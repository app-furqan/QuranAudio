name: Refresh jsDelivr Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge jsDelivr (recursive full repository purge)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          purge_url_base="https://purge.jsdelivr.net/gh/${REPO}@main"
          purge_target_sha="${SHA:-HEAD}"

          purged_count=0

          purge_one() {
            local rel_path="$1"
            local url="${purge_url_base}${rel_path}"
            echo "Purging: $url"
            curl -fsSL "$url" >/dev/null
            purged_count=$((purged_count + 1))
          }

          # Purge root and directory paths first so listing/index caches are refreshed.
          purge_one ""
          purge_one "/RaadAlKurdi"
          purge_one "/RaadAlKurdi/"
          purge_one "/RaadAlKurdi/segments"
          purge_one "/RaadAlKurdi/segments/"

          echo "Collecting all tracked files from ${purge_target_sha}"
          mapfile -t all_files < <(git ls-tree -r --name-only "${purge_target_sha}")

          for file in "${all_files[@]}"; do
            [[ -z "$file" ]] && continue
            purge_one "/${file}"
          done

          echo "jsDelivr recursive purge completed. Total URLs purged: ${purged_count}"
