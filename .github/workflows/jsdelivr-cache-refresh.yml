name: Refresh jsDelivr Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr (entire repository)
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          root_url="https://purge.jsdelivr.net/gh/${REPO}@main"

          echo "Purging repository cache: $root_url"
          curl -fsSL "$root_url" >/dev/null

          echo "Repository-wide purge complete."
