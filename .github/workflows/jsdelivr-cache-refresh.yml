name: Refresh jsDelivr Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_purge:
        description: "Purge all tracked files recursively"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr (batch of 10)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_PURGE: ${{ github.event.inputs.full_purge || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          purge_endpoint="https://purge.jsdelivr.net/"
          api_base="https://api.github.com/repos/${REPO}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          batch_size=10

          declare -a purge_targets=()
          declare -A seen_targets=()

          add_target_pair() {
            local rel_path="$1"
            local p1="/gh/${REPO}@main${rel_path}"
            local p2="/gh/${REPO}${rel_path}"

            if [[ -z "${seen_targets[$p1]+x}" ]]; then
              seen_targets["$p1"]=1
              purge_targets+=("$p1")
            fi
            if [[ -z "${seen_targets[$p2]+x}" ]]; then
              seen_targets["$p2"]=1
              purge_targets+=("$p2")
            fi
          }

          # Always include root and directory paths.
          add_target_pair ""
          add_target_pair "/RaadAlKurdi"
          add_target_pair "/RaadAlKurdi/"
          add_target_pair "/RaadAlKurdi/segments"
          add_target_pair "/RaadAlKurdi/segments/"

          if [[ "${FULL_PURGE}" == "true" ]]; then
            echo "Manual full purge requested. Fetching tree from GitHub API..."
            mapfile -t all_files < <(
              curl -fsS -H "${auth_header}" \
                "${api_base}/git/trees/${SHA}?recursive=1" \
              | jq -r '.tree[] | select(.type == "blob") | .path'
            )
            for file in "${all_files[@]}"; do
              [[ -z "$file" ]] && continue
              add_target_pair "/${file}"
            done

          elif [[ -n "${BEFORE:-}" ]] && [[ "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            echo "Collecting changed paths between ${BEFORE} and ${SHA} via GitHub API..."
            page=1
            while :; do
              response=$(curl -fsS -H "${auth_header}" \
                "${api_base}/compare/${BEFORE}...${SHA}?per_page=100&page=${page}")
              mapfile -t files < <(echo "$response" | jq -r '.files[]? | .filename, .previous_filename // empty')
              [[ ${#files[@]} -eq 0 ]] && break
              for file in "${files[@]}"; do
                [[ -z "$file" ]] && continue
                add_target_pair "/${file}"
              done
              # Stop if fewer than 100 files on this page (last page)
              file_count=$(echo "$response" | jq '.files | length')
              [[ "$file_count" -lt 100 ]] && break
              page=$((page + 1))
            done

          else
            echo "No valid commit range found; purging only root/directories."
          fi

          total=${#purge_targets[@]}
          if [[ "$total" -eq 0 ]]; then
            echo "No purge targets."
            exit 0
          fi

          echo "Purging ${total} jsDelivr paths in batches of ${batch_size}."

          ok=0
          fail=0
          i=0
          while [[ "$i" -lt "$total" ]]; do
            batch=("${purge_targets[@]:$i:$batch_size}")
            payload=$(printf '%s\n' "${batch[@]}" | jq -R . | jq -s '{path: .}')

            echo "Submitting batch starting at index ${i} (size ${#batch[@]})."
            if response=$(curl -fsS -H "content-type: application/json" -d "$payload" "$purge_endpoint"); then
              ok=$((ok + ${#batch[@]}))
              echo "Batch accepted: ${response}"
            else
              fail=$((fail + ${#batch[@]}))
              echo "Batch failed at index ${i}."
            fi

            i=$((i + batch_size))
          done

          echo "Purge done. Accepted paths: ${ok}, failed paths: ${fail}."

          if [[ "$fail" -gt 0 ]]; then
            exit 1
          fi
